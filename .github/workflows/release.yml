name: release

on:
  push:
    tags:
      # Glob patterns (not regex). Matches 5.6, 5.10, test-release, etc.
      - "[0-9].*"
      - "test-release"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload assets to"
        required: true
        default: "5.6"

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

  build-archlinux:
    name: build-archlinux
    needs: ["create-release"]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: build package
        id: build_package
        uses: PinkD/arch-pkgbuild-builder@v2.4
        with:
          target: "pkgbuild"
          pkgname: "pack"
      - name: upload package to artifact
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-package
          path: pack/corplink-rs-*.pkg.tar.zst
      - name: upload package to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: pack/corplink-rs-${{ needs.create-release.outputs.tag }}*.pkg.tar.zst
          tag: ${{ needs.create-release.outputs.tag }}
          overwrite: true
          file_glob: true
      - name: create tarball
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          cp pack/pkg/corplink-rs/usr/bin/corplink-rs .
          cp config.example.json config.json
          tar -czf "corplink-rs-${TAG}-linux-$(uname -m).tar.gz" corplink-rs config.json
      - name: upload tarball to artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: corplink-rs-*-linux-*.tar.gz
      - name: upload tarball to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: corplink-rs-*-linux-*.tar.gz
          tag: ${{ needs.create-release.outputs.tag }}
          overwrite: true
          file_glob: true

  build-macos:
    name: build-macos
    needs: ["create-release"]
    # GitHub-hosted Apple Silicon runner (arm64)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22.0"
      - name: build libwg
        run: cd libwg && ./build.sh
      - name: build package
        run: cargo build --release
      - name: build GUI
        run: |
          chmod +x gui/build.sh gui/scripts/*.sh
          ./gui/build.sh
      - name: build tarball
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          STAGE="corplink-rs-${TAG}-macos-$(uname -m)"
          mkdir -p "$STAGE"
          cp target/release/corplink-rs "$STAGE/"
          cp -R gui/CorplinkGUI.app "$STAGE/"
          cp config.example.json "$STAGE/config.json"
          cp gui/README.md "$STAGE/GUI-README.md"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          ls -lh "${STAGE}.tar.gz"
      - name: upload package to artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-tarball
          path: corplink-rs-*-macos-*.tar.gz
      - name: upload package to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: corplink-rs-*-macos-*.tar.gz
          tag: ${{ needs.create-release.outputs.tag }}
          overwrite: true
          file_glob: true

  build-windows:
    name: build-windows
    needs: ["create-release"]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22.0"
      - name: build libwg
        run: cd libwg && ./build.ps1
      - name: rust install gnu toolchain
        run: rustup toolchain install stable-gnu
      - name: rust use gnu toolchain
        run: rustup default stable-x86_64-pc-windows-gnu
      - name: build package
        run: cargo build --release
      - name: build check result
        shell: pwsh
        run: |
          $tag = "${{ needs.create-release.outputs.tag }}"
          Move-Item -Path "target/release/corplink-rs.exe" -Destination "."
          Copy-Item -Path "config.example.json" -Destination "config.json"
          Copy-Item -Path "scripts/setup.ps1" -Destination "."
          Compress-Archive -Path corplink-rs.exe,config.json,setup.ps1 -Destination "corplink-rs-$tag-windows.zip"
      - name: upload package to artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: corplink-rs-*-windows.zip
      - name: upload package to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: corplink-rs-*-windows.zip
          tag: ${{ needs.create-release.outputs.tag }}
          overwrite: true
          file_glob: true
